[project]
name = "ticketflow"
version = "0.1.0"
description = "Auditable multi-agent service desk with durable human approval"
requires-python = ">=3.11"
dependencies = [
  "deepagents==0.7.20", "langchain-openai==1.6.6",
  "langgraph-checkpoint-sqlite==3.1.1", "fastapi==0.142.1",
  "uvicorn==0.54.0", "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
